trigger:
  - main

pool:
  name: 'B13-pool'

variables:
  artifactVersion: '1.0.$(Build.BuildId)'

  dockerRegistryServiceConnection: 'ACR-HAD'
  containerRegistry: 'hadacr2026.azurecr.io'
  imageRepository: 'human-activity-detection'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

  sonarServiceConnection: 'SONARCLOUD-SERVICE'
  sonarOrganization: 'sanjugm-1'
  sonarProjectKey: 'sanjugm_HAD'
  sonarProjectName: 'HAD'

stages:

- stage: Gitleaks
  displayName: 'Gitleaks'

  jobs:
  - job: GitleaksScan
    displayName: 'Secret Scan'

    steps:

    - checkout: self
      fetchDepth: 0

    - powershell: |
        $ErrorActionPreference = "Stop"

        $version = "8.24.2"
        $zip = "$(Agent.TempDirectory)\gitleaks.zip"
        $dir = "$(Agent.TempDirectory)\gitleaks"

        Invoke-WebRequest `
          -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip" `
          -OutFile $zip

        if (Test-Path $dir) {
          Remove-Item $dir -Recurse -Force
        }

        Expand-Archive `
          -Path $zip `
          -DestinationPath $dir `
          -Force

        & "$dir\gitleaks.exe" version
      displayName: 'Install Gitleaks'

    - powershell: |
        $ErrorActionPreference = "Stop"

        $gitleaks = "$(Agent.TempDirectory)\gitleaks\gitleaks.exe"
        $reportDir = "$(Build.ArtifactStagingDirectory)\gitleaks"

        New-Item `
          -ItemType Directory `
          -Path $reportDir `
          -Force | Out-Null

        & $gitleaks detect `
          --source "$(Build.SourcesDirectory)" `
          --redact `
          --report-format sarif `
          --report-path "$reportDir\gitleaks.sarif"

        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
      displayName: 'Scan for Secrets'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Gitleaks Report'
      condition: always()
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\gitleaks'
        artifact: 'Gitleaks-Report'
        publishLocation: 'pipeline'


- stage: SonarCloud
  displayName: 'SonarCloud'

  dependsOn: Gitleaks
  condition: succeeded()

  jobs:
  - job: SonarAnalysis
    displayName: 'SonarCloud Analysis'

    steps:

    - checkout: self
      fetchDepth: 0

    - task: SonarCloudPrepare@4.2.5
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: '$(sonarServiceConnection)'
        organization: '$(sonarOrganization)'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: '$(sonarProjectKey)'
        cliProjectName: '$(sonarProjectName)'
        cliSources: '.'
        extraProperties: |
          sonar.exclusions=**/*.ipynb,**/.venv/**,**/models/**,**/images/**,**/*.mp4,**/node_modules/**
          sonar.sourceEncoding=UTF-8

    - task: SonarCloudAnalyze@4.2.5
      displayName: 'Run SonarCloud Analysis'


- stage: QualityGate
  displayName: 'Quality Gate'

  dependsOn: SonarCloud
  condition: succeeded()

  jobs:
  - job: QualityGateCheck
    displayName: 'Quality Gate Check'

    steps:

    - checkout: self

    - task: SonarCloudPublish@4.2.5
      displayName: 'Publish Quality Gate'
      inputs:
        pollingTimeoutSec: '300'


- stage: BuildAndPush
  displayName: 'Build and Push to ACR'

  dependsOn: QualityGate
  condition: succeeded()

  jobs:
  - job: DockerBuildPush
    displayName: 'Build Docker Image and Push to ACR'

    steps:

    - checkout: self

    - powershell: |
        docker version
        docker info
      displayName: 'Check Docker'

    - task: Docker@2
      displayName: 'Build and Push Image to ACR'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        tags: |
          $(artifactVersion)
          latest

    - powershell: |
        Write-Host "IMAGE PUSH SUCCESSFUL"
        Write-Host "Registry: $(containerRegistry)"
        Write-Host "Repository: $(imageRepository)"
        Write-Host "Artifact Version: $(artifactVersion)"
        Write-Host "$(containerRegistry)/$(imageRepository):$(artifactVersion)"
        Write-Host "$(containerRegistry)/$(imageRepository):latest"
      displayName: 'Show Artifact Version'
