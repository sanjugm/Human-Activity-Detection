trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'ACR-HAD'
  containerRegistry: 'hadacr2026.azurecr.io'
  imageRepository: 'human-activity-detection'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  imageTag: '$(Build.BuildId)'

  sonarServiceConnection: 'SONARCLOUD-SERVICE'
  sonarOrganization: 'sanjugm'
  sonarProjectKey: 'sanjugm_Human-Activity-Detection'
  sonarProjectName: 'Human-Activity-Detection'

stages:

- stage: SecurityAndQuality
  displayName: 'Security and Code Quality'

  jobs:

  - job: Gitleaks
    displayName: 'Gitleaks Secret Scan'

    steps:

    - checkout: self
      fetchDepth: 0

    - bash: |
        set -e

        GITLEAKS_VERSION="8.24.2"

        curl -sSfL \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o gitleaks.tar.gz

        tar -xzf gitleaks.tar.gz

        sudo mv gitleaks /usr/local/bin/gitleaks

        gitleaks version
      displayName: 'Install Gitleaks'

    - bash: |
        set -e

        mkdir -p "$(Build.ArtifactStagingDirectory)/gitleaks"

        gitleaks detect \
          --source "$(Build.SourcesDirectory)" \
          --redact \
          --report-format sarif \
          --report-path "$(Build.ArtifactStagingDirectory)/gitleaks/gitleaks.sarif"
      displayName: 'Scan Repository for Secrets'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Gitleaks Report'
      condition: always()
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/gitleaks'
        artifact: 'Gitleaks-Report'
        publishLocation: 'pipeline'

  - job: SonarCloud
    displayName: 'SonarCloud Analysis'

    steps:

    - checkout: self
      fetchDepth: 0

    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: '$(sonarServiceConnection)'
        organization: '$(sonarOrganization)'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: '$(sonarProjectKey)'
        cliProjectName: '$(sonarProjectName)'
        cliSources: '.'
        extraProperties: |
          sonar.exclusions=**/*.ipynb,**/.venv/**,**/models/**,**/images/**,**/*.mp4
          sonar.python.version=3.7
          sonar.sourceEncoding=UTF-8

    - task: SonarCloudAnalyze@4
      displayName: 'Run SonarCloud Analysis'

    - task: SonarCloudPublish@4
      displayName: 'Publish SonarCloud Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

- stage: BuildAndPush
  displayName: 'Build Docker Image and Push to ACR'

  dependsOn: SecurityAndQuality
  condition: succeeded()

  jobs:

  - job: DockerBuildPush
    displayName: 'Docker Build and Push'

    steps:

    - checkout: self

    - bash: |
        docker --version
      displayName: 'Check Docker'

    - task: Docker@2
      displayName: 'Build and Push Image to ACR'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        tags: |
          $(imageTag)
          latest

    - bash: |
        echo "========================================"
        echo "IMAGE PUSH SUCCESSFUL"
        echo "========================================"
        echo ""
        echo "Registry: $(containerRegistry)"
        echo "Repository: $(imageRepository)"
        echo "Build Tag: $(imageTag)"
        echo ""
        echo "$(containerRegistry)/$(imageRepository):$(imageTag)"
        echo "$(containerRegistry)/$(imageRepository):latest"
        echo "========================================"
      displayName: 'Display Docker Image Information'

- stage: PipelineSummary
  displayName: 'Pipeline Summary'

  dependsOn:
    - SecurityAndQuality
    - BuildAndPush

  condition: always()

  jobs:

  - job: Summary
    displayName: 'Pipeline Summary'

    steps:

    - bash: |
        echo "========================================"
        echo "        PIPELINE SUMMARY"
        echo "========================================"
        echo ""
        echo "Gitleaks      : Completed"
        echo "SonarCloud    : Completed"
        echo "Quality Gate  : Checked"
        echo "Docker Build  : Completed"
        echo "ACR Push      : Completed"
        echo ""
        echo "ACR Registry  : hadacr2026.azurecr.io"
        echo "Repository    : human-activity-detection"
        echo "Image Tag     : $(Build.BuildId)"
        echo ""
        echo "========================================"
      displayName: 'Show Pipeline Summary'